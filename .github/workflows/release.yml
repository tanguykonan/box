name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: box.exe
            archive: box-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: box
            archive: box-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: box
            archive: box-macos-arm64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            binary: box
            archive: box-macos-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.binary }} -DestinationPath ${{ matrix.archive }}
          Get-FileHash -Algorithm SHA256 ${{ matrix.archive }} | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Out-File -FilePath "${{ matrix.archive }}.sha256" -Encoding utf8

      - name: Package Archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ${{ matrix.archive }} ${{ matrix.binary }}
          shasum -a 256 ${{ matrix.archive }} > "${{ matrix.archive }}.sha256"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/${{ matrix.target }}/release/${{ matrix.archive }}
            target/${{ matrix.target }}/release/${{ matrix.archive }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}