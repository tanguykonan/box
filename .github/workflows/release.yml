name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: box.exe
            archive: box-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: box
            archive: box-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: box
            archive: box-darwin-arm64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            binary: box
            archive: box-darwin-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.binary }} -DestinationPath ${{ matrix.archive }}
          Get-FileHash -Algorithm SHA256 ${{ matrix.archive }} | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Out-File -FilePath "${{ matrix.archive }}.sha256" -Encoding utf8
          Copy-Item -Path ${{ matrix.binary }} -Destination "box-windows-x86_64.exe"
          Get-FileHash -Algorithm SHA256 "box-windows-x86_64.exe" | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Out-File -FilePath "box-windows-x86_64.exe.sha256" -Encoding utf8

      - name: Package Archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ${{ matrix.archive }} ${{ matrix.binary }}
          shasum -a 256 ${{ matrix.archive }} > "${{ matrix.archive }}.sha256"
          
          if [[ "${{ matrix.archive }}" == *"darwin-arm64"* ]]; then
            cp ${{ matrix.archive }} box-macos-arm64.tar.gz
            shasum -a 256 box-macos-arm64.tar.gz > box-macos-arm64.tar.gz.sha256
            cp ${{ matrix.binary }} box-darwin-arm64
            shasum -a 256 box-darwin-arm64 > box-darwin-arm64.sha256
          elif [[ "${{ matrix.archive }}" == *"darwin-x86_64"* ]]; then
            cp ${{ matrix.archive }} box-macos-x86_64.tar.gz
            shasum -a 256 box-macos-x86_64.tar.gz > box-macos-x86_64.tar.gz.sha256
            cp ${{ matrix.binary }} box-darwin-x86_64
            shasum -a 256 box-darwin-x86_64 > box-darwin-x86_64.sha256
          elif [[ "${{ matrix.archive }}" == *"linux-x86_64"* ]]; then
            cp ${{ matrix.binary }} box-linux-x86_64
            shasum -a 256 box-linux-x86_64 > box-linux-x86_64.sha256
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/${{ matrix.target }}/release/*.tar.gz
            target/${{ matrix.target }}/release/*.zip
            target/${{ matrix.target }}/release/*.exe
            target/${{ matrix.target }}/release/box-*
            target/${{ matrix.target }}/release/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}