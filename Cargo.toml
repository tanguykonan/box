[package]
name = "box-cli"
version = "1.0.1"
edition = "2021"
authors = ["tanguykonan.dev"]
description = "Autonomous Application Packaging"
license = "MIT OR Apache-2.0"
default-run = "box"

[lib]
name = "box_cli"
path = "src/lib.rs"

[[bin]]
name = "box"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
zstd = "0.13"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1.0"
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"
directories = "5.0"
tempfile = "3.14"
walkdir = "2.5"
ureq = { version = "2.10", features = ["json", "native-tls"] }
indicatif = { version = "0.17", features = ["rayon"] }
console = "0.15"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
shlex = "2.0"
pathdiff = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
